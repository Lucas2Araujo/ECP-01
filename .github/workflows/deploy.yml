name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Define permissões necessárias para publicação no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy simultâneo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar Índice de Materiais
        run: python scripts/generate_index.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Publica a raiz do repositório com index.html, style.css, app.js e data/index.json
          path: "."

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

